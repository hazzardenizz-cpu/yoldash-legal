const copy={fa:{title:'حریم خصوصی Yoldash',meta:'آخرین به‌روزرسانی: 1 اکتبر 2026',back:'← بازگشت به Yoldash',body:`<p>Yoldash یک پلتفرم حمل‌ونقل جاده‌ای است. حساب وب و اپلیکیشن از زیرساخت مشترک استفاده می‌کنند.</p><h2>اطلاعات حساب</h2><p>برای ایجاد حساب ممکن است ایمیل، نام، شماره تلفن و نوع فعالیت تجاری شما ذخیره شود. اطلاعات پروفایل برای ارائه قابلیت‌های مرتبط با حمل‌ونقل استفاده می‌شود.</p><h2>اطلاعات حمل‌ونقل</h2><p>اعلام بار، مبدأ و مقصد، نوع بار، نوع خودرو، وضعیت حمل، پیشنهادها، پیام‌ها و اطلاعات مرتبط با عملیات Yoldash می‌تواند برای اجرای خدمات ذخیره و پردازش شود.</p><h2>امنیت و دسترسی</h2><p>دسترسی به داده‌ها بر اساس حساب کاربری و سیاست‌های دسترسی سامانه محدود می‌شود. اطلاعات محرمانه مدیریتی در مرورگر قرار نمی‌گیرد.</p><h2>حذف یا اصلاح اطلاعات</h2><p>برای درخواست اصلاح یا حذف اطلاعات حساب، از بخش پشتیبانی Yoldash با ما تماس بگیرید.</p><h2>تماس</h2><p>برای پرسش‌های مربوط به حریم خصوصی از کانال‌های رسمی Yoldash استفاده کنید.</p>`},tr:{title:'Yoldash Gizlilik Politikası',meta:'Son güncelleme: 1 Ekim 2026',back:'← Yoldash’a dön',body:`<p>Yoldash bir karayolu yük taşımacılığı platformudur. Web ve mobil uygulama aynı hesap ve altyapıyı kullanır.</p><h2>Hesap bilgileri</h2><p>Hesap oluştururken e-posta, ad, telefon ve işletme türü gibi bilgiler işlenebilir.</p><h2>Taşıma verileri</h2><p>Yük ilanları, çıkış/varış noktaları, yük ve araç türleri, taşıma durumları, teklifler ve mesajlar hizmetin yürütülmesi için saklanabilir.</p><h2>Güvenlik</h2><p>Veri erişimi kullanıcı hesabı ve erişim politikalarıyla sınırlandırılır. Yönetici sırları tarayıcıya gönderilmez.</p><h2>Düzeltme veya silme</h2><p>Hesap verilerinizin düzeltilmesi veya silinmesi için Yoldash destek kanallarından iletişime geçebilirsiniz.</p>`},en:{title:'Yoldash Privacy Policy',meta:'Last updated: October 1, 2026',back:'← Back to Yoldash',body:`<p>Yoldash is a road-freight transportation platform. The web app and mobile app use a shared account and backend.</p><h2>Account information</h2><p>When you create an account, Yoldash may process your email, name, phone number and business account type.</p><h2>Freight data</h2><p>Load postings, origins and destinations, cargo and truck types, shipment status, offers and messages may be stored and processed to provide the service.</p><h2>Security and access</h2><p>Access is limited using user authentication and backend access policies. Administrative secrets are not placed in the browser.</p><h2>Correction or deletion</h2><p>You may request correction or deletion of account information through official Yoldash support channels.</p>`}};
