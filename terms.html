const copy={fa:{title:'شرایط استفاده Yoldash',meta:'آخرین به‌روزرسانی: 1 اکتبر 2026',back:'← بازگشت به Yoldash',body:`<p>با استفاده از Yoldash، شما می‌پذیرید که اطلاعات حساب و اعلام‌های حمل‌ونقل را صحیح و قانونی وارد کنید.</p><h2>ماهیت سرویس</h2><p>Yoldash ابزار ارتباط و مدیریت فرآیند حمل‌ونقل جاده‌ای است. کاربران مسئول بررسی شرایط معامله، اسناد، مجوزها، بیمه و الزامات قانونی مرتبط با حمل خود هستند.</p><h2>حساب کاربری</h2><p>شما مسئول حفظ امنیت حساب و اطلاعات ورود خود هستید و نباید از حساب دیگران استفاده کنید.</p><h2>اعلام بار و درخواست حمل</h2><p>اطلاعات بار، قیمت، مسیر و ظرفیت باید تا حد ممکن دقیق باشد. استفاده فریبکارانه، محتوای غیرقانونی یا سوءاستفاده از کاربران مجاز نیست.</p><h2>تغییرات</h2><p>Yoldash ممکن است برای امنیت، کیفیت یا الزامات قانونی این شرایط و قابلیت‌های سرویس را به‌روزرسانی کند.</p>`},tr:{title:'Yoldash Kullanım Şartları',meta:'Son güncelleme: 1 Ekim 2026',back:'← Yoldash’a dön',body:`<p>Yoldash’ı kullanarak hesap ve taşıma bilgilerinin doğru ve hukuka uygun olmasını kabul edersiniz.</p><h2>Hizmetin niteliği</h2><p>Yoldash karayolu yük taşımacılığı için iletişim ve iş akışı araçları sağlar. Kullanıcılar kendi işlemlerine ilişkin belge, izin, sigorta ve yasal gereklilikleri kontrol etmekten sorumludur.</p><h2>Hesap güvenliği</h2><p>Hesabınızın ve giriş bilgilerinizin güvenliğinden siz sorumlusunuz.</p><h2>Yük ilanları ve taşıma talepleri</h2><p>Yük, fiyat, rota ve kapasite bilgilerinin doğru olması gerekir. Dolandırıcılık ve yasa dışı kullanım yasaktır.</p>`},en:{title:'Yoldash Terms of Use',meta:'Last updated: October 1, 2026',back:'← Back to Yoldash',body:`<p>By using Yoldash, you agree to provide accurate and lawful account and freight information.</p><h2>Nature of the service</h2><p>Yoldash provides communication and workflow tools for road freight. Users remain responsible for checking transaction terms, documents, permits, insurance and applicable legal requirements.</p><h2>Account security</h2><p>You are responsible for protecting your account and sign-in credentials.</p><h2>Load postings and transport requests</h2><p>Load, price, route and capacity information should be accurate. Fraudulent or unlawful use is prohibited.</p>`}};
